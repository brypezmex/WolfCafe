server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Behind a Cloudflare Tunnel the real scheme and host arrive in headers.
    # Trusting the forwarded values keeps redirects and logging correct.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Hashed build assets never change contents, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API so the browser only ever talks to this one origin.
    # This is what makes the deployment host-agnostic: the frontend requests the
    # relative path /api, and it resolves correctly whether the site is reached
    # at localhost, a LAN IP, or a Cloudflare Tunnel hostname.
    location /api/ {
        proxy_pass         http://backend:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Large enough for JWT headers coming back from the backend.
        proxy_buffer_size       8k;
        proxy_buffers        8  8k;

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }

    # Client-side routing: unknown paths fall through to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached or clients keep booting an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
