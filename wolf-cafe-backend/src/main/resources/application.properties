spring.application.name=wolf-cafe-backend

# ---------------------------------------------------------------------------
# Datasource. Every value is environment-overridable so the same image can run
# locally, in Docker Compose, or on any remote host without a rebuild.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wolfcafe_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

server.port=${SERVER_PORT:8080}

# Only the health endpoint is exposed, for container health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Behind a reverse proxy (nginx / Cloudflare Tunnel) honour the forwarded
# host, port, and protocol so generated URLs and logging stay correct.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
app.jwt-secret=${JWT_SECRET:2bb80d537b1da3e38bd30361aa855686bde0eacd7162fef6a25fe97bf527a25b}
app.jwt-expiration-milliseconds=${JWT_EXPIRATION_MS:604800000}

# Shared password for the three seeded accounts: admin, staff, and customer.
app.default-user-password=${DEFAULT_PASSWORD:password}

# Comma-separated list of allowed browser origins. "*" allows any origin, which
# is the sensible default when the API is served behind the same hostname as
# the frontend (the nginx proxy) or through a Cloudflare Tunnel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Default sales tax rate used until an admin saves one
app.tax-rate=${TAX_RATE:0.02}

# ---------------------------------------------------------------------------
# Nightly database reset
# ---------------------------------------------------------------------------
app.db-reset.enabled=${DB_RESET_ENABLED:true}
app.db-reset.cron=${DB_RESET_CRON:0 0 0 * * *}
app.db-reset.zone=${DB_RESET_ZONE:America/New_York}

# ---------------------------------------------------------------------------
# Profanity filter
# ---------------------------------------------------------------------------
app.profanity.enabled=${PROFANITY_FILTER_ENABLED:true}
